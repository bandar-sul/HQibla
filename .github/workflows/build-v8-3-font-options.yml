name: H9 Qibla 8.3 Corrected UI Manual APK
on:
  workflow_dispatch:
  push:
    branches: [ v8-3-font-options ]
    paths:
      - '.github/workflows/build-v8-3-font-options.yml'
      - 'scripts/apply-font-options.py'
      - 'app/**'
      - 'build.gradle'
permissions:
  contents: write
jobs:
  patch-and-build:
    runs-on: ubuntu-24.04
    env:
      H9_SIGNING_STORE_FILE: /home/runner/work/_temp/H9-Qibla-Production.jks
      H9_SIGNING_STORE_PASSWORD: ${{ secrets.H9_SIGNING_STORE_PASSWORD }}
      H9_SIGNING_KEY_ALIAS: ${{ secrets.H9_SIGNING_KEY_ALIAS }}
      H9_SIGNING_KEY_PASSWORD: ${{ secrets.H9_SIGNING_KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: 0EF79FA3FC09DC6C6E0FD5ECA1ABB58CC4219DB2E5DF3BEF4623EE9B89655676
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply corrected layout and font options
        run: python3 scripts/apply-font-options.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/sa/h9/qibla/MainActivity.java app/src/main/java/sa/h9/qibla/QiblaView.java
          git diff --cached --quiet || git commit -m "Apply corrected H9 Qibla layout and font controls"
          git push
      - name: Restore production signing key
        env:
          H9_SIGNING_KEY_B64: ${{ secrets.H9_SIGNING_KEY_B64 }}
        run: |
          test -n "$H9_SIGNING_KEY_B64"
          printf '%s' "$H9_SIGNING_KEY_B64" | base64 -d > "$H9_SIGNING_STORE_FILE"
          chmod 600 "$H9_SIGNING_STORE_FILE"
      - name: Verify production signing certificate
        run: |
          CERT_SHA=$(keytool -list -v -keystore "$H9_SIGNING_STORE_FILE" -storepass "$H9_SIGNING_STORE_PASSWORD" -alias "$H9_SIGNING_KEY_ALIAS" | awk -F': ' '/SHA256:/{gsub(":","",$2); print toupper($2); exit}')
          test "$CERT_SHA" = "$EXPECTED_CERT_SHA256"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build signed manual APK
        run: gradle clean testReleaseUnitTest assembleRelease --stacktrace
      - name: Verify APK signature and package
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          CERT_SHA=$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/certificate SHA-256 digest:/{gsub(/[[:space:]:]/,"",$NF); print toupper($NF); exit}')
          test "$CERT_SHA" = "$EXPECTED_CERT_SHA256"
          mkdir -p dist
          cp "$APK" dist/H9-Qibla-8.3-Fonts-Manual.apk
          sha256sum dist/H9-Qibla-8.3-Fonts-Manual.apk | tee dist/H9-Qibla-8.3-Fonts-Manual.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: H9-Qibla-8.3-Fonts-Manual
          path: |
            dist/H9-Qibla-8.3-Fonts-Manual.apk
            dist/H9-Qibla-8.3-Fonts-Manual.sha256
