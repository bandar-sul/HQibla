name: Build H9 Qibla 5.1 DR Object Decode APK
on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: h9qibla-stable-signing-v1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle clean assembleDebug --stacktrace
      - run: mkdir -p dist && cp app/build/outputs/apk/debug/app-debug.apk dist/H9-Qibla-5.1-DR-Object-Decode-Haval-H9.apk
      - uses: actions/upload-artifact@v4
        with:
          name: H9-Qibla-5.1-DR-Object-Decode-Haval-H9
          path: dist/H9-Qibla-5.1-DR-Object-Decode-Haval-H9.apk

