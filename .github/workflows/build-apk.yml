name: Build H9 Qibla 6.3 Arabic Settings OTA APK
on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: h9qibla-stable-signing-v1
      - name: Prepare stable signing certificate
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=H9 Qibla,OU=H9,O=H9,L=Buraydah,C=SA"
          fi
          CERT_SHA=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | awk -F': ' '/SHA256:/{gsub(":","",$2); print toupper($2); exit}')
          echo "EXPECTED_CERT_SHA256=$CERT_SHA" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build protected release
        run: gradle clean assembleRelease -PEXPECTED_CERT_SHA256="$EXPECTED_CERT_SHA256" --stacktrace
      - name: Package APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/H9-Qibla-6.3-Arabic-Settings-Haval-H9.apk
          sha256sum dist/H9-Qibla-6.3-Arabic-Settings-Haval-H9.apk | tee dist/H9-Qibla-6.3-Arabic-Settings-Haval-H9.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: H9-Qibla-6.3-Arabic-Settings-Haval-H9
          path: |
            dist/H9-Qibla-6.3-Arabic-Settings-Haval-H9.apk
            dist/H9-Qibla-6.3-Arabic-Settings-Haval-H9.sha256
