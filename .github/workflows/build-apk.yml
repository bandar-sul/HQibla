name: Build H9 Qibla 0.4 APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle clean assembleDebug --stacktrace

      - name: Publish APK to repository
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/H9-Qibla-0.4-Haval-H9.apk
          sha256sum dist/H9-Qibla-0.4-Haval-H9.apk > dist/H9-Qibla-0.4-Haval-H9.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add dist/H9-Qibla-0.4-Haval-H9.apk dist/H9-Qibla-0.4-Haval-H9.sha256
          git commit -m "Publish H9 Qibla 0.4 APK" || true
          git push

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: H9-Qibla-0.4-Haval-H9
          path: dist/H9-Qibla-0.4-Haval-H9.apk
