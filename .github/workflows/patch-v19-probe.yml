name: Apply H9 Qibla 1.9 Middleware URI Probe

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-v19-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.9 middleware probe patch
        run: python3 tools/patch_v19_probe.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/sa/h9/qibla/MainActivity.java app/src/main/java/sa/h9/qibla/QiblaView.java app/build.gradle
          git commit -m "H9 Qibla 1.9 middleware URI probe" || true
          git push
