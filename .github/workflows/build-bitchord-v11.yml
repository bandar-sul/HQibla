name: Build BitChord H9 Arabic V11

on:
  push:
    branches: [bitchord-h9-v11-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: bitchord-h9-v11-build

      - name: Checkout BitChord v1.4.1
        uses: actions/checkout@v4
        with:
          repository: kushagrasinghx/BitChord
          ref: v1.4.1
          path: bitchord

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply H9 V11 patches
        run: python3 scripts/prepare_bitchord_v11.py

      - name: Verify V11
        run: |
          grep -q '1.4.1-H9-ar11' bitchord/app/build.gradle.kts
          grep -q '0.27f, 300.dp' bitchord/app/src/main/java/com/music/bitchord/ui/screens/DetailScreen.kt
          grep -q '0.60f, 980.dp' bitchord/app/src/main/java/com/music/bitchord/ui/player/NowPlayingScreen.kt
          grep -q '0.58f else 1f' bitchord/app/src/main/java/com/music/bitchord/MainActivity.kt
          grep -q 'h9_account_integrations' bitchord/app/src/main/res/values-ar/strings.xml

      - name: Build prodDebug
        working-directory: bitchord
        run: chmod +x gradlew && ./gradlew --no-daemon assembleProdDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp bitchord/app/build/outputs/apk/prod/debug/app-prod-debug.apk dist/BitChord-H9-v1.4.1-Arabic-v11.apk
          sha256sum dist/BitChord-H9-v1.4.1-Arabic-v11.apk

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=bitchord-h9-v1.4.1-ar-v11
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" dist/BitChord-H9-v1.4.1-Arabic-v11.apk --target "$GITHUB_SHA" --title "BitChord H9 v1.4.1 Arabic V11" --notes "Haval H9 V11: dedicated landscape sizing, shorter album hero, balanced Now Playing artwork, compact mini player, stable Arabic resource catalogue, larger H9 safe area, and more deferred startup work."
