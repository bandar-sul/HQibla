plugins {
    id 'com.android.application'
}

android {
    namespace 'sa.h9.qibla'
    compileSdk 35

    defaultConfig {
        applicationId 'sa.h9.qibla.stable'
        minSdk 28
        targetSdk 34
        versionCode 89
        versionName '8.9'
        buildConfigField "String", "EXPECTED_CERT_SHA256", "\"" + (project.findProperty("EXPECTED_CERT_SHA256") ?: "") + "\""
        buildConfigField "String", "UPDATE_MANIFEST_URL", "\"https://raw.githubusercontent.com/bandar-sul/HQibla/main/latest.json\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        debugConfig {
            storeFile file("${rootDir}/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        production {
            def storePath = System.getenv("H9_SIGNING_STORE_FILE")
            if (storePath != null && !storePath.isEmpty()) {
                storeFile file(storePath)
                storePassword System.getenv("H9_SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("H9_SIGNING_KEY_ALIAS")
                keyPassword System.getenv("H9_SIGNING_STORE_PASSWORD")
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debugConfig
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.production
            signingConfig.enableV1Signing = true
            signingConfig.enableV2Signing = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
    }
}

// trigger 3.0 focused LocationServiceImpl build


dependencies {
    implementation 'androidx.core:core:1.13.1'
}
