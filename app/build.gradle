plugins {
    id 'com.android.application'
}

android {
    namespace 'sa.h9.qibla'
    compileSdk 35

    defaultConfig {
        applicationId 'sa.h9.qibla.stable'
        minSdk 28
        targetSdk 28
        versionCode 58
        versionName '5.8-ota-security'
    }

    buildFeatures {
        buildConfig true
    }

    def expectedCert = project.findProperty("EXPECTED_CERT_SHA256") ?: ""

    defaultConfig {
        buildConfigField "String", "EXPECTED_CERT_SHA256", "\"" + expectedCert + "\""
        buildConfigField "String", "UPDATE_MANIFEST_URL", "\"https://h9-story.com/h9qibla/latest.json\""
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// trigger 3.0 focused LocationServiceImpl build


dependencies {
    implementation 'androidx.core:core:1.13.1'
}
