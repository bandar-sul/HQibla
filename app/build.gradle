plugins {
    id 'com.android.application'
}

android {
    namespace 'sa.h9.qibla'
    compileSdk 35

    defaultConfig {
        applicationId 'sa.h9.qibla.stable'
        minSdk 28
        targetSdk 28
        versionCode 35
        versionName '3.5-test'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

